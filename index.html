<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Upkeep v2.31</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #2d5a27; --accent: #6b8e23; --bg: #f8fafc; --text: #334155; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --blue: #3b82f6; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; background: var(--bg); color: var(--text); font-size: 13px; padding-bottom: 100px; }
        .header { background: white; padding: 15px; text-align: center; border-radius: 15px; margin-bottom: 10px; border-bottom: 3px solid var(--primary); }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding: 5px 0; }
        .tab-menu button { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; background: #e2e8f0; font-weight: bold; color: #64748b; font-size: 10px; }
        .tab-menu button.active { background: var(--primary); color: white; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* Dashboard & Progress */
        .dash-card { background: white; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .compare-row { padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .progress-bar { background: #e2e8f0; border-radius: 5px; height: 8px; margin-top: 5px; overflow: hidden; }
        .progress-fill { background: var(--success); height: 100%; transition: width 0.5s; }
        .reason-text { font-size: 10px; color: #ef4444; font-style: italic; margin-top: 3px; display: block; }

        /* Form */
        .row { display: flex; gap: 8px; margin-bottom: 8px; }
        .paddock-row { display: flex; flex-direction: column; gap: 5px; background: #f1f5f9; padding: 10px; border-radius: 10px; margin-bottom: 8px; position: relative; }
        input, textarea, select { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box; width: 100%; }
        .btn-main { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        
        .acc-item { background: white; margin-bottom: 8px; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        .acc-header { padding: 12px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .acc-body { padding: 12px; display: none; border-top: 1px solid #eee; font-size: 12px; }

        .total-footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; color: white; padding: 15px; text-align: center; font-weight: bold; z-index: 100; border-top: 3px solid var(--primary); }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; color: var(--primary); font-size: 18px;">Monitoring Upkeep v2.31</h2>
</div>

<div class="tab-menu">
    <button id="tabDash" class="active" onclick="switchTab('Dash')">📊 DASHBOARD</button>
    <button id="tabPlanning" onclick="switchTab('Planning')">📋 PLANNING</button>
    <button id="tabHasil" onclick="switchTab('Hasil')">✅ HASIL</button>
    <button id="tabRekap" onclick="switchTab('Rekap')">🔎 HISTORY</button>
</div>

<div id="viewDash">
    <div class="card" style="text-align:center;">
        <input type="date" id="tglDash" onchange="loadDashboard()" style="border:none; font-weight:bold; color:var(--primary); width:auto;">
    </div>
    
    <div id="captureArea">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <b style="color:var(--primary)">PRODUKTIVITAS PER KEGIATAN</b>
                <span id="labelTglDash" style="font-size:10px; font-weight:bold;"></span>
            </div>
            <div id="listKomparasi"></div>
        </div>
    </div>
    <button class="btn-main" style="background:var(--blue); margin-bottom:20px;" onclick="downloadDashJPG()">📸 DOWNLOAD DASHBOARD (JPG)</button>
</div>

<div id="viewMain" style="display:none;">
    <div class="card" style="text-align:center;"><input type="date" id="tglLaporan" onchange="loadData()" style="border:none; font-weight:bold; color:var(--primary); width:auto;"></div>

    <div class="card">
        <b id="formTitle">Input Data</b>
        <input type="hidden" id="editId">
        <input type="text" id="kegiatan" placeholder="📝 Nama Kegiatan" style="margin-top:10px;">
        
        <div id="paddockContainer" style="margin-top:10px;">
            <div class="paddock-row">
                <input type="text" class="p-name" placeholder="📍 Paddock">
                <input type="number" class="p-luas" placeholder="📐 Luas (Ha)" step="0.01">
            </div>
        </div>
        <button onclick="addRow('paddockContainer')" style="background:none; border:1px dashed var(--primary); color:var(--primary); width:100%; padding:8px; border-radius:10px; margin-bottom:10px;">+ Paddock</button>

        <div class="row"><input type="number" id="hk" placeholder="👷 HK"><input type="text" id="unit" placeholder="🚜 Alat"></div>
        <div id="bahanContainer"><div class="row"><input type="text" class="b-name" placeholder="🧪 Bahan"></div></div>
        <button onclick="addRow('bahanContainer')" style="background:none; border:1px dashed var(--primary); color:var(--primary); width:100%; padding:8px; border-radius:10px; margin-bottom:10px;">+ Bahan</button>
        
        <textarea id="catatan" placeholder="🚩 Catatan / Alasan (Jika target tidak tercapai)" rows="2" style="margin-bottom:10px; border:1px solid var(--danger);"></textarea>
        <button class="btn-main" onclick="simpanData()">💾 SIMPAN DATA</button>
        <button id="btnUpdate" style="display:none; background:var(--blue); color:white; width:100%; padding:15px; border-radius:12px; margin-top:5px; border:none;" onclick="updateData()">🆙 UPDATE DATA</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px; margin-bottom:10px;">
        <button onclick="salinWA()" style="background:var(--success); color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; font-size:10px;">SALIN WA</button>
        <button onclick="copyToHasil()" style="background:var(--blue); color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; font-size:10px;">KE HASIL</button>
        <button onclick="hapusSemuaHariIni()" style="background:var(--danger); color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; font-size:10px;">HAPUS</button>
    </div>
    <div id="displayList"></div>
</div>

<div id="viewRekap" style="display:none;">
    <div class="card">
        <div class="row"><input type="date" id="rekapMulai"><input type="date" id="rekapSelesai"></div>
        <select id="filterType" style="margin-bottom:10px;">
            <option value="SEMUA">SEMUA DATA</option>
            <option value="Planning">PLANNING</option>
            <option value="Hasil">HASIL</option>
        </select>
        <button class="btn-main" onclick="prosesHistory()">🔎 CARI HISTORY</button>
        <button id="btnDownloadHistory" style="display:none; background:#64748b; color:white; border:none; width:100%; padding:12px; border-radius:12px; font-weight:bold; margin-top:8px;" onclick="downloadHistoryCSV()">📂 DOWNLOAD CSV HISTORY</button>
    </div>
    <div id="hasilRekap"></div>
</div>

<div class="total-footer" id="footerTotalHK">TOTAL HK: 0 👷</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAgxUFI0NSD-7Ka8ZxFJwkupR6rgb_i00w",
        authDomain: "monitoring-upkeep.firebaseapp.com",
        projectId: "monitoring-upkeep",
        storageBucket: "monitoring-upkeep.firebasestorage.app",
        messagingSenderId: "631929326010",
        appId: "1:631929326010:web:8f9263c2a9281ef7ff7583"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let currentTab = "Dash";
    let historyGlobal = [];

    function switchTab(t) {
        currentTab = t;
        document.querySelectorAll('.tab-menu button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab'+t).classList.add('active');
        document.getElementById('viewDash').style.display = (t === 'Dash') ? 'block' : 'none';
        document.getElementById('viewMain').style.display = (t === 'Planning' || t === 'Hasil') ? 'block' : 'none';
        document.getElementById('viewRekap').style.display = (t === 'Rekap') ? 'block' : 'none';
        if(t === 'Dash') loadDashboard();
        if(t === 'Planning' || t === 'Hasil') { document.getElementById('formTitle').innerText = "Input " + t; loadData(); }
    }

    function addRow(id, valName="", valLuas="") {
        const div = document.createElement('div');
        if(id === 'paddockContainer') {
            div.className = 'paddock-row';
            div.innerHTML = `<button onclick="this.parentElement.remove()" style="position:absolute;right:5px;top:5px;border:none;background:red;color:white;border-radius:50%;width:18px;height:18px;font-size:10px;">✕</button>
                <input type="text" class="p-name" value="${valName}" placeholder="📍 Paddock">
                <input type="number" class="p-luas" value="${valLuas}" placeholder="📐 Luas (Ha)" step="0.01">`;
        } else {
            div.className = 'row';
            div.innerHTML = `<input type="text" class="b-name" value="${valName}" placeholder="🧪 Bahan"><button onclick="this.parentElement.remove()" style="border:none;background:none;color:red;">✕</button>`;
        }
        document.getElementById(id).appendChild(div);
    }

    async function simpanData() {
        const tgl = document.getElementById('tglLaporan').value;
        const paddocks = Array.from(document.querySelectorAll('.p-name')).map((el, i) => ({
            name: el.value, luas: parseFloat(document.querySelectorAll('.p-luas')[i].value) || 0
        })).filter(p => p.name !== "");
        
        const payload = {
            tgl, type: currentTab, kegiatan: document.getElementById('kegiatan').value,
            paddocks, bahans: Array.from(document.querySelectorAll('.b-name')).map(el => el.value).filter(b => b !== ""),
            hk: parseInt(document.getElementById('hk').value) || 0, unit: document.getElementById('unit').value,
            catatan: document.getElementById('catatan').value, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        if(!payload.kegiatan) return alert("Isi Kegiatan!");
        await db.collection("reports_v13").add(payload);
        clearForm();
    }

    function loadData() {
        const tgl = document.getElementById('tglLaporan').value;
        db.collection("reports_v13").where("tgl", "==", tgl).where("type", "==", currentTab).onSnapshot(snap => {
            let listHtml = "", totalHK = 0;
            snap.forEach(doc => {
                const d = doc.data(); totalHK += (d.hk || 0);
                const sumL = d.paddocks.reduce((a, b) => a + (parseFloat(b.luas) || 0), 0);
                listHtml += `<div class="acc-item">
                    <div class="acc-header" onclick="toggleAcc('${doc.id}')">
                        <span>📝 ${d.kegiatan} (${sumL.toFixed(2)} Ha)</span>
                        <div style="display:flex; gap:5px;">
                            <button onclick="editTarik('${doc.id}')" style="background:var(--blue); color:white; border:none; padding:4px 8px; border-radius:4px; font-size:10px;">EDIT</button>
                            <button onclick="hapusSatu('${doc.id}')" style="background:var(--danger); color:white; border:none; padding:4px 8px; border-radius:4px; font-size:10px;">✕</button>
                        </div>
                    </div>
                    <div class="acc-body" id="body-${doc.id}">
                        <b>Paddock:</b> ${d.paddocks.map(p => `${p.name} (${p.luas}Ha)`).join(", ")}<br>
                        <b>HK/Alat:</b> ${d.hk} / ${d.unit || "-"}<br>
                        <b>Catatan:</b> ${d.catatan || "-"}<br>
                    </div>
                </div>`;
            });
            document.getElementById('displayList').innerHTML = listHtml;
            document.getElementById('footerTotalHK').innerText = `TOTAL HK ${currentTab.toUpperCase()}: ${totalHK} 👷`;
        });
    }

    async function loadDashboard() {
        const tgl = document.getElementById('tglDash').value;
        document.getElementById('labelTglDash').innerText = tgl;
        const snap = await db.collection("reports_v13").where("tgl", "==", tgl).get();
        let mapP = {}, mapR = {}, mapNote = {};

        snap.forEach(doc => {
            const d = doc.data();
            const sumL = d.paddocks.reduce((a, b) => a + (parseFloat(b.luas) || 0), 0);
            const key = d.kegiatan.toLowerCase().trim();
            if(d.type === 'Planning') mapP[key] = (mapP[key] || 0) + sumL;
            else { 
                mapR[key] = (mapR[key] || 0) + sumL;
                if(d.catatan) mapNote[key] = d.catatan;
            }
        });

        let html = "";
        const allKeys = [...new Set([...Object.keys(mapP), ...Object.keys(mapR)])];
        allKeys.forEach(k => {
            const p = mapP[k] || 0, r = mapR[k] || 0;
            const pct = p > 0 ? Math.round(r/p*100) : 100;
            html += `<div class="compare-row">
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:12px;">
                    <span>${k.toUpperCase()}</span> <span>${r.toFixed(2)} / ${p.toFixed(2)} Ha (${pct}%)</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(pct, 100)}%; background:${pct < 100 ? 'var(--warning)' : 'var(--success)'}"></div></div>
                ${mapNote[k] ? `<span class="reason-text">🚩 Catatan: ${mapNote[k]}</span>` : ""}
            </div>`;
        });
        document.getElementById('listKomparasi').innerHTML = html || "<center>Belum ada data</center>";
    }

    async function downloadDashJPG() {
        const element = document.getElementById("captureArea");
        const canvas = await html2canvas(element);
        const link = document.createElement("a");
        link.download = `Dashboard_Upkeep_${document.getElementById('tglDash').value}.jpg`;
        link.href = canvas.toDataURL("image/jpeg");
        link.click();
    }

    async function prosesHistory() {
        const s = document.getElementById('rekapMulai').value;
        const e = document.getElementById('rekapSelesai').value;
        const f = document.getElementById('filterType').value;
        if(!s || !e) return alert("Pilih tanggal!");
        
        const q = await db.collection("reports_v13").where("tgl", ">=", s).where("tgl", "<=", e).orderBy("tgl", "desc").get();
        let html = ""; historyGlobal = [];
        q.forEach(doc => {
            const d = doc.data();
            if(f !== "SEMUA" && d.type !== f) return;
            historyGlobal.push(d);
            const color = d.type === "Planning" ? "var(--blue)" : "var(--success)";
            html += `<div class="card" style="border-left:5px solid ${color}; font-size:11px;">
                <b>📅 ${d.tgl} [${d.type.toUpperCase()}]</b><br>
                <b>📝 ${d.kegiatan}</b> | Pdk: ${d.paddocks.map(p => p.name).join(", ")} | HK: ${d.hk}<br>
                ${d.catatan ? `<span style="color:red">Note: ${d.catatan}</span>` : ""}
            </div>`;
        });
        document.getElementById('hasilRekap').innerHTML = html || "<center>Data tidak ditemukan</center>";
        document.getElementById('btnDownloadHistory').style.display = historyGlobal.length > 0 ? "block" : "none";
    }

    function downloadHistoryCSV() {
        let csv = "Tanggal,Tipe,Kegiatan,Paddock,LuasTotal,HK,Unit,Bahan,Catatan\n";
        historyGlobal.forEach(d => {
            const sumL = d.paddocks.reduce((a,b) => a + b.luas, 0);
            csv += `"${d.tgl}","${d.type}","${d.kegiatan}","${d.paddocks.map(p=>p.name).join(";")}","${sumL}","${d.hk}","${d.unit}","${d.bahans ? d.bahans.join(";") : ""}","${d.catatan || ""}"\n`;
        });
        const blob = new Blob([csv], {type:'text/csv'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `History_Upkeep_Full.csv`; a.click();
    }

    function toggleAcc(id) { const b = document.getElementById('body-'+id); b.style.display = (b.style.display === 'block') ? 'none' : 'block'; }
    function clearForm() { 
        document.getElementById('kegiatan').value = ""; document.getElementById('hk').value = ""; document.getElementById('unit').value = ""; document.getElementById('catatan').value = "";
        document.getElementById('paddockContainer').innerHTML = `<div class="paddock-row"><input type="text" class="p-name" placeholder="📍 Paddock"><input type="number" class="p-luas" placeholder="📐 Luas (Ha)"></div>`;
        document.getElementById('btnUpdate').style.display = "none";
    }

    // Inisialisasi
    document.getElementById('tglDash').valueAsDate = new Date();
    document.getElementById('tglLaporan').valueAsDate = new Date();
    document.getElementById('rekapMulai').valueAsDate = new Date();
    document.getElementById('rekapSelesai').valueAsDate = new Date();
    loadDashboard();
</script>
</body>
</html>
