<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upkeep v2.40 - Full Upgrade</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
body {font-family:Arial; margin:0; background:#f1f5f9; padding:10px;}
.card {background:white; padding:12px; border-radius:10px; margin-bottom:10px;}
.btn {padding:10px; border:none; border-radius:8px; width:100%; margin-top:5px;}
.green {background:#22c55e; color:white;}
.blue {background:#3b82f6; color:white;}
.red {background:#ef4444; color:white;}
input,select,textarea {width:100%; padding:8px; margin-bottom:6px;}
</style>
</head>

<body>

<h3>🚜 Upkeep Monitoring v2.40</h3>

<!-- FORM -->
<div class="card">
<input type="date" id="tgl">
<input type="text" id="kegiatan" placeholder="Kegiatan">

<div id="paddockContainer">
<input class="p-name" placeholder="Paddock">
<input class="p-luas" type="number" placeholder="Luas">
</div>

<button onclick="addRow()">+ Paddock</button>

<input type="number" id="hk" placeholder="HK">
<input type="text" id="unit" placeholder="Unit">

<select id="statusUnit">
<option>Kerja</option>
<option>Rusak</option>
<option>Standby</option>
</select>

<input type="text" id="bahan" placeholder="Bahan">
<input type="number" id="dosis" placeholder="Dosis">

<input id="totalBahan" placeholder="Total (auto)" readonly>

<textarea id="catatan" placeholder="Catatan"></textarea>

<select id="type">
<option>Planning</option>
<option>Hasil</option>
</select>

<button class="btn green" onclick="simpan()">💾 Simpan</button>
</div>

<!-- LIST -->
<div id="list"></div>

<!-- HISTORY -->
<div class="card">
<h4>📊 History</h4>

<input type="date" id="filterTanggal" onchange="load()">

<select id="filterType" onchange="load()">
<option value="ALL">Semua</option>
<option>Planning</option>
<option>Hasil</option>
</select>

<button class="btn blue" onclick="downloadCSV()">⬇️ Download CSV</button>

<div id="history"></div>
</div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyAgxUFI0NSD-7Ka8ZxFJwkupR6rgb_i00w",
authDomain: "monitoring-upkeep.firebaseapp.com",
projectId: "monitoring-upkeep"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

new Sortable(document.getElementById('paddockContainer'), {animation:150});

function addRow(){
let d=document.createElement('div');
d.innerHTML=`<input class="p-name"><input class="p-luas" type="number">`;
document.getElementById('paddockContainer').appendChild(d);
}

function hitung(){
let dosis=parseFloat(dosisEl.value)||0;
let luas=[...document.querySelectorAll('.p-luas')].reduce((a,b)=>a+(parseFloat(b.value)||0),0);
totalBahan.value=(luas*dosis).toFixed(2);
}

dosisEl=document.getElementById('dosis');
dosisEl.oninput=hitung;

async function simpan(){
let paddocks=[...document.querySelectorAll('.p-name')].map((el,i)=>({
name:el.value,
luas:parseFloat(document.querySelectorAll('.p-luas')[i].value)||0
}));

let data={
tgl:tgl.value,
kegiatan:kegiatan.value,
paddocks,
hk:parseInt(hk.value)||0,
unit:unit.value,
statusUnit:statusUnit.value,
bahan:bahan.value,
dosis:parseFloat(dosis.value)||0,
totalBahan:parseFloat(totalBahan.value)||0,
catatan:catatan.value,
type:type.value
};

await db.collection("reports_v13").add(data);
alert("Tersimpan");
load();
}

async function load(){
let snap=await db.collection("reports_v13").get();
let html="";

let ft=filterTanggal.value;
let tp=filterType.value;

snap.forEach(doc=>{
let d=doc.data();

if(ft && d.tgl!=ft) return;
if(tp!="ALL" && d.type!=tp) return;

let luas=d.paddocks.reduce((a,b)=>a+b.luas,0);
let eff=luas>0?(d.hk/luas).toFixed(2):0;

html+=`
<div class="card">
<b>${d.kegiatan}</b> (${d.type})<br>
📅 ${d.tgl}<br>
Luas: ${luas} Ha<br>
HK: ${d.hk} | HK/Ha: ${eff}<br>
Unit: ${d.unit} (${d.statusUnit})<br>

${d.bahan?`
🧪 ${d.bahan}<br>
Total: ${d.totalBahan}<br>
Dosis: ${d.dosis}
`:''}

<br>📝 ${d.catatan||""}
</div>
`;
});

history.innerHTML=html;
}

async function downloadCSV(){
let snap=await db.collection("reports_v13").get();

let csv="Tanggal,Type,Kegiatan,Luas,HK,HK/Ha,Unit,Status,Bahan,Dosis,Total,Catatan\n";

snap.forEach(doc=>{
let d=doc.data();
let luas=d.paddocks.reduce((a,b)=>a+b.luas,0);
let eff=luas>0?(d.hk/luas).toFixed(2):0;

csv+=`${d.tgl},${d.type},${d.kegiatan},${luas},${d.hk},${eff},${d.unit},${d.statusUnit},${d.bahan},${d.dosis},${d.totalBahan},${d.catatan}\n`;
});

let blob=new Blob([csv]);
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download="data.csv";
a.click();
}

load();
</script>

</body>
</html>
