<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Tebu - Merauke</title>
    <style>
        :root { --primary: #1a73e8; --secondary: #28a745; --danger: #dc3545; }
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background-color: #f0f2f5; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Tab Styling */
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #eee; padding: 5px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: none; transition: 0.3s; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .status-bar { text-align: center; font-size: 11px; margin-bottom: 15px; padding: 8px; border-radius: 6px; background: #e8f0fe; color: #1967d2; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 13px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        .item-box { border: 1px solid #e0e0e0; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fff; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #f8f9fa; padding: 5px 10px; border-radius: 5px; }
        
        .nav-btns { display: flex; gap: 4px; }
        .btn-nav { width: 30px; height: 30px; cursor: pointer; border: 1px solid #ccc; background: white; border-radius: 4px; }
        
        .alat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
        .alat-row div { text-align: center; font-size: 10px; }

        .btn-main { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-add { background: var(--secondary); }
        .btn-save { background: var(--primary); }
        .btn-csv { background: #6c757d; }
        .btn-wa { background: #25d366; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Monitoring Pekerjaan</h2>
    <div id="status" class="status-bar">Memuat data Cloud...</div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('plan')">PLANNING</button>
        <button class="tab-btn" onclick="switchTab('aktual')">AKTUAL</button>
    </div>

    <label>Tanggal Pekerjaan :</label>
    <input type="date" id="tanggal">

    <div id="section-plan">
        <div id="container-plan"></div>
        <button class="btn-main btn-add" onclick="addItem('plan')">+ Tambah Planning</button>
    </div>

    <div id="section-aktual" class="hidden">
        <div id="container-aktual"></div>
        <button class="btn-main btn-add" onclick="addItem('aktual')">+ Tambah Aktual</button>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    
    <button class="btn-main btn-save" id="saveBtn" onclick="saveToCloud()">☁️ Simpan Semua ke Cloud</button>
    <button class="btn-main btn-wa" onclick="copyToWA()">📋 Salin Laporan WA (Aktual)</button>
    <button class="btn-main btn-csv" onclick="downloadCSV()">📥 Download Data ke CSV (Excel)</button>
</div>

<script>
    // --- KONFIGURASI JSONBIN ---
    const BIN_ID = "MASUKKAN_BIN_ID_ANDA"; 
    const API_KEY = "MASUKKAN_MASTER_KEY_ANDA"; 
    const URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentMode = 'plan';

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        
        document.getElementById('section-plan').classList.toggle('hidden', mode !== 'plan');
        document.getElementById('section-aktual').classList.toggle('hidden', mode !== 'aktual');
    }

    const itemTemplate = (type) => `
        <div class="item-header">
            <strong class="label-idx">Kegiatan</strong>
            <div class="nav-btns">
                <button class="btn-nav" onclick="moveItem(this, -1)">↑</button>
                <button class="btn-nav" onclick="moveItem(this, 1)">↓</button>
                <button class="btn-nav" style="color:red" onclick="this.closest('.item-box').remove(); updateLabels('${type}')">✕</button>
            </div>
        </div>
        <input type="text" class="jenis" placeholder="Jenis Pekerjaan">
        <div style="display:flex; gap:5px; margin-top:5px">
            <input type="text" class="ha" placeholder="HA">
            <input type="text" class="lokasi" placeholder="Lokasi">
        </div>
        <input type="text" class="hk" placeholder="Jumlah HK" style="margin-top:5px">
        <input type="text" class="bahan" placeholder="Bahan" style="margin-top:5px">
        <input type="text" class="alat" placeholder="Nama Alat" style="margin-top:5px">
        <div class="alat-row">
            <div><label>Bekerja</label><input type="text" class="b"></div>
            <div><label>Rusak</label><input type="text" class="r"></div>
            <div><label>Standby</label><input type="text" class="s"></div>
        </div>
        <textarea class="ket" rows="2" placeholder="Keterangan..." style="margin-top:5px"></textarea>
    `;

    function addItem(type, data = null) {
        const div = document.createElement('div');
        div.className = 'item-box';
        div.innerHTML = itemTemplate(type);
        document.getElementById(`container-${type}`).appendChild(div);
        if(data) {
            div.querySelector('.jenis').value = data.jenis || "";
            div.querySelector('.ha').value = data.ha || "";
            div.querySelector('.lokasi').value = data.lokasi || "";
            div.querySelector('.hk').value = data.hk || "";
            div.querySelector('.bahan').value = data.bahan || "";
            div.querySelector('.alat').value = data.alat || "";
            div.querySelector('.b').value = data.b || "";
            div.querySelector('.r').value = data.r || "";
            div.querySelector('.s').value = data.s || "";
            div.querySelector('.ket').value = data.ket || "";
        }
        updateLabels(type);
    }

    function updateLabels(type) {
        document.querySelectorAll(`#container-${type} .item-box`).forEach((box, i) => {
            box.querySelector('.label-idx').innerText = `${type.toUpperCase()} ${i+1}`;
        });
    }

    function moveItem(btn, dir) {
        const box = btn.closest('.item-box');
        const parent = box.parentNode;
        if(dir === -1 && box.previousElementSibling) parent.insertBefore(box, box.previousElementSibling);
        if(dir === 1 && box.nextElementSibling) parent.insertBefore(box.nextElementSibling, box);
        updateLabels(parent.id.replace('container-', ''));
    }

    // --- DATA HANDLING ---
    function collectData(type) {
        return Array.from(document.querySelectorAll(`#container-${type} .item-box`)).map(box => ({
            jenis: box.querySelector('.jenis').value,
            ha: box.querySelector('.ha').value,
            lokasi: box.querySelector('.lokasi').value,
            hk: box.querySelector('.hk').value,
            bahan: box.querySelector('.bahan').value,
            alat: box.querySelector('.alat').value,
            b: box.querySelector('.b').value,
            r: box.querySelector('.r').value,
            s: box.querySelector('.s').value,
            ket: box.querySelector('.ket').value
        }));
    }

    async function saveToCloud() {
        const btn = document.getElementById('saveBtn');
        btn.innerText = "⏳ Menyimpan...";
        const payload = {
            tgl: document.getElementById('tanggal').value,
            plan: collectData('plan'),
            aktual: collectData('aktual')
        };
        try {
            await fetch(URL, {
                method: 'PUT',
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(payload)
            });
            alert("Data Planning & Aktual Tersimpan!");
        } catch (e) { alert("Gagal Simpan."); }
        btn.innerText = "☁️ Simpan Semua ke Cloud";
    }

    async function loadCloud() {
        try {
            const res = await fetch(URL, { headers: { "X-Master-Key": API_KEY } });
            const result = await res.json();
            const d = result.record;
            document.getElementById('tanggal').value = d.tgl || "";
            if(d.plan) d.plan.forEach(item => addItem('plan', item));
            if(d.aktual) d.aktual.forEach(item => addItem('aktual', item));
            document.getElementById('status').innerText = "Cloud Terkoneksi ✅";
        } catch (e) { addItem('plan'); addItem('aktual'); }
    }

    function copyToWA() {
        const tgl = document.getElementById('tanggal').value.split('-').reverse().join('/') || '-';
        let msg = `*LAPORAN AKTUAL PEKERJAAN*\nTanggal: ${tgl}\n${"=".repeat(20)}\n\n`;
        let totalHK = 0;
        collectData('aktual').forEach((j, i) => {
            totalHK += parseFloat(j.hk) || 0;
            msg += `*${i+1}. ${j.jenis.toUpperCase()}*\n📍 Lokasi: ${j.lokasi} (${j.ha} HA)\n👷 Tenaga: ${j.hk} HK\n📦 Bahan: ${j.bahan}\n🚜 Alat: ${j.alat} (B:${j.b}, R:${j.r}, S:${j.s})\n📝 Ket: ${j.ket}\n\n`;
        });
        msg += `*TOTAL HK AKTUAL: ${totalHK} HK*`;
        navigator.clipboard.writeText(msg).then(() => alert("Teks Aktual Disalin!"));
    }

    function downloadCSV() {
        const tgl = document.getElementById('tanggal').value || 'data';
        let csv = "TIPE,NO,JENIS,HA,LOKASI,HK,BAHAN,ALAT,BEKERJA,RUSAK,STANDBY,KETERANGAN\n";
        
        ['plan', 'aktual'].forEach(type => {
            collectData(type).forEach((j, i) => {
                csv += `${type.toUpperCase()},${i+1},"${j.jenis}","${j.ha}","${j.lokasi}","${j.hk}","${j.bahan}","${j.alat}","${j.b}","${j.r}","${j.s}","${j.ket}"\n`;
            });
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', `Laporan_${tgl}.csv`);
        a.click();
    }

    window.onload = loadCloud;
</script>
</body>
</html>
