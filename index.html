<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Upkeep v2.40 - Professional Edition</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root { --primary: #2d5a27; --bg: #f8fafc; --text: #334155; --danger: #ef4444; --success: #22c55e; --blue: #3b82f6; --warning: #f59e0b; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; background: var(--bg); color: var(--text); font-size: 13px; padding-bottom: 120px; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tab-menu button { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; background: #e2e8f0; font-weight: bold; color: #64748b; font-size: 10px; min-width: 85px; }
        .tab-menu button.active { background: var(--primary); color: white; }
        
        .live-card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); cursor: grab; position: relative; }
        .live-card:active { cursor: grabbing; }
        .unit-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin: 8px 0; }
        .unit-box { font-size: 10px; padding: 5px; border-radius: 5px; text-align: center; font-weight: bold; border: 1px solid #cbd5e1; }
        
        input, textarea, select { padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 13px; margin-bottom: 5px; }
        .btn-main { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 5px; }
        .total-footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; color: white; padding: 12px; text-align: center; font-weight: bold; z-index: 1000; border-top: 4px solid var(--primary); }
        .paddock-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #cbd5e1; padding: 3px 0; font-size: 11px; }
        
        /* Sortable Ghost Class */
        .sortable-ghost { opacity: 0.4; background: #d1fae5; border: 2px dashed var(--primary); }
    </style>
</head>
<body>

<div class="card" style="text-align:center; padding:10px; margin-bottom:10px;">
    <h3 style="margin:0; color:var(--primary);">Monitoring Upkeep v2.40</h3>
</div>

<div class="tab-menu">
    <button id="tabDash" class="active" onclick="switchTab('Dash')">📊 DASHBOARD</button>
    <button id="tabPlanning" onclick="switchTab('Planning')">📋 PLANNING</button>
    <button id="tabHasil" onclick="switchTab('Hasil')">✅ HASIL</button>
    <button id="tabRekap" onclick="switchTab('Rekap')">🔎 HISTORY</button>
    <button id="tabMaster" onclick="switchTab('Master')">⚙️ MASTER</button>
</div>

<div id="viewMaster" style="display:none;">
    <div class="card">
        <b>⚙️ Pengaturan Master Data</b>
        <div style="margin-top:10px;">
            <label>Tambah Nama Kegiatan:</label>
            <div style="display:flex; gap:5px;">
                <input type="text" id="m_kegiatan" placeholder="Contoh: Herbisida Pra-Tumbuh">
                <button onclick="saveMaster('kegiatan', 'm_kegiatan')" style="padding:0 15px; background:var(--primary); color:white; border-radius:8px; border:none;">+</button>
            </div>
            <label>Tambah Nama Bahan:</label>
            <div style="display:flex; gap:5px;">
                <input type="text" id="m_bahan" placeholder="Contoh: Urea / Glyfosat">
                <button onclick="saveMaster('bahan', 'm_bahan')" style="padding:0 15px; background:var(--primary); color:white; border-radius:8px; border:none;">+</button>
            </div>
        </div>
    </div>
</div>

<div id="viewMain" style="display:none;">
    <div class="card">
        <input type="date" id="tglLaporan" onchange="loadData()">
        <b id="formTitle">Form Input Laporan</b>
        <input type="hidden" id="editId">
        
        <select id="kegiatan" placeholder="Pilih Kegiatan"></select>
        
        <div id="paddockContainer">
            <div class="card" style="background:#f1f5f9; padding:8px; margin-bottom:5px;">
                <input type="text" class="p-name" placeholder="Paddock" oninput="hitungOtomatis()">
                <input type="number" class="p-luas" placeholder="Luas (Ha)" step="0.01" oninput="hitungOtomatis()">
            </div>
        </div>
        <button onclick="addRow('paddockContainer')" style="width:100%; padding:8px; margin-bottom:10px; border-radius:10px; border:1px dashed var(--primary); background:transparent; color:var(--primary); font-weight:bold;">+ Tambah Paddock</button>
        
        <div style="display:flex; gap:5px;">
            <input type="number" id="hk" placeholder="Total HK">
            <input type="text" id="unit_nama" placeholder="Alat/Unit">
        </div>

        <div class="unit-grid">
            <div class="unit-box" style="color:var(--success);">KERJA<input type="number" id="u_kerja" value="0"></div>
            <div class="unit-box" style="color:var(--danger);">RUSAK<input type="number" id="u_rusak" value="0"></div>
            <div class="unit-box" style="color:var(--warning);">S-BY<input type="number" id="u_standby" value="0"></div>
        </div>

        <div style="display:flex; gap:5px;">
            <select id="bahan" onchange="hitungOtomatis()"></select>
            <input type="number" id="dosis" placeholder="Dosis" step="0.01" oninput="hitungOtomatis()" style="width:50%;">
            <select id="satuan" style="width:30%;">
                <option value="L">L</option><option value="mL">mL</option>
                <option value="Kg">Kg</option><option value="Gr">Gr</option>
            </select>
        </div>
        <input type="number" id="totalBahan" placeholder="Total Bahan (Auto)" readonly style="background:#e2e8f0; font-weight:bold;">

        <textarea id="catatan" placeholder="Catatan lapangan..."></textarea>
        <button class="btn-main" id="btnSimpan" onclick="simpanData()">💾 SIMPAN DATA</button>
        <button class="btn-main" id="btnUpdate" style="display:none; background:var(--blue);" onclick="updateData()">🆙 UPDATE DATA</button>
    </div>
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
        <button onclick="salinWA()" style="background:var(--success); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;">🟢 SALIN WA</button>
        <button onclick="copyToHasil()" style="background:var(--blue); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;">🔄 COPY KE HASIL</button>
    </div>
    <div id="displayList"></div>
</div>

<div id="viewRekap" style="display:none;">
    <div class="card">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-bottom:10px;">
            <input type="date" id="rekapTglAwal" onchange="loadRekap()">
            <input type="date" id="rekapTglAkhir" onchange="loadRekap()">
        </div>
        <select id="filterType" onchange="loadRekap()">
            <option value="ALL">SEMUA (PLAN & HASIL)</option>
            <option value="Planning">PLANNING SAJA</option>
            <option value="Hasil">HASIL SAJA</option>
        </select>
        <button onclick="downloadCSV()" class="btn-main" style="background:#1e293b;">📥 DOWNLOAD CSV</button>
    </div>
    <div id="listRekap"></div>
</div>

<div id="viewDash" style="display:none;">
    <div class="card"><input type="date" id="tglDash" onchange="loadDashboard()"></div>
    <div id="captureArea"><div class="card" id="listKomparasi"></div></div>
    <button class="btn-main" style="background:var(--blue);" onclick="downloadDashJPG()">📸 DOWNLOAD JPG</button>
</div>

<div class="total-footer" id="footerTotal">TOTAL HK: 0</div>

<script>
    // Config Firebase (Pakai milik Pak Sihar yang sudah ada)
    const firebaseConfig = {
        apiKey: "AIzaSyAgxUFI0NSD-7Ka8ZxFJwkupR6rgb_i00w",
        authDomain: "monitoring-upkeep.firebaseapp.com",
        projectId: "monitoring-upkeep",
        storageBucket: "monitoring-upkeep.firebasestorage.app",
        messagingSenderId: "631929326010",
        appId: "1:631929326010:web:8f9263c2a9281ef7ff7583"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let currentTab = "Dash";
    // Inisialisasi Drag and Drop (Sortable)
    const el = document.getElementById('displayList');
    const sortable = Sortable.create(el, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: function() { console.log("Urutan disusun ulang"); }
    });

    function switchTab(t) {
        currentTab = t;
        document.querySelectorAll('.tab-menu button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab'+t).classList.add('active');
        const views = ['Dash', 'Planning', 'Hasil', 'Rekap', 'Master'];
        views.forEach(v => {
            const el = document.getElementById('view' + (v === 'Planning' || v === 'Hasil' ? 'Main' : v));
            if(el) el.style.display = 'none';
        });
        
        if(t === 'Planning' || t === 'Hasil') {
            document.getElementById('viewMain').style.display = 'block';
            loadData();
            loadMasterOptions();
        } else {
            document.getElementById('view'+t).style.display = 'block';
        }
        if(t === 'Dash') loadDashboard();
        if(t === 'Rekap') loadRekap();
    }

    async function saveMaster(col, inputId) {
        const val = document.getElementById(inputId).value;
        if(!val) return;
        await db.collection("master_" + col).add({ name: val.toUpperCase() });
        document.getElementById(inputId).value = "";
        alert("Berhasil ditambah!");
    }

    async function loadMasterOptions() {
        const kSnap = await db.collection("master_kegiatan").orderBy("name").get();
        const bSnap = await db.collection("master_bahan").orderBy("name").get();
        
        let kOpt = '<option value="">-- Pilih Kegiatan --</option>';
        kSnap.forEach(doc => kOpt += `<option value="${doc.data().name}">${doc.data().name}</option>`);
        document.getElementById('kegiatan').innerHTML = kOpt;

        let bOpt = '<option value="">-- Pilih Bahan --</option>';
        bSnap.forEach(doc => bOpt += `<option value="${doc.data().name}">${doc.data().name}</option>`);
        document.getElementById('bahan').innerHTML = bOpt;
    }

    function hitungOtomatis() {
        const dosis = parseFloat(document.getElementById('dosis').value) || 0;
        const luasArr = Array.from(document.querySelectorAll('.p-luas')).map(el => parseFloat(el.value) || 0);
        const totalLuas = luasArr.reduce((a, b) => a + b, 0);
        document.getElementById('totalBahan').value = (totalLuas * dosis).toFixed(2);
    }

    function addRow(id, valN="", valL="") {
        const div = document.createElement('div');
        div.className = 'card'; div.style = "background:#f1f5f9; padding:10px; margin-bottom:5px; position:relative;";
        div.innerHTML = `<button onclick="this.parentElement.remove(); hitungOtomatis();" style="position:absolute;right:5px;top:5px;border:none;background:red;color:white;border-radius:50%;width:18px;height:18px;font-size:10px;">✕</button>
            <input type="text" class="p-name" value="${valN}" placeholder="Paddock" oninput="hitungOtomatis()">
            <input type="number" class="p-luas" value="${valL}" placeholder="Luas (Ha)" step="0.01" oninput="hitungOtomatis()">`;
        document.getElementById(id).appendChild(div);
    }

    async function simpanData() {
        const tgl = document.getElementById('tglLaporan').value;
        const kegiatan = document.getElementById('kegiatan').value;
        const paddocks = Array.from(document.querySelectorAll('.p-name')).map((el, i) => ({
            name: el.value, luas: parseFloat(document.querySelectorAll('.p-luas')[i].value) || 0
        })).filter(p => p.name !== "");
        
        if(!kegiatan || paddocks.length === 0) return alert("Kegiatan atau Paddock belum diisi!");
        
        const payload = {
            tgl, type: currentTab, kegiatan, paddocks,
            hk: parseInt(document.getElementById('hk').value) || 0,
            unit: document.getElementById('unit_nama').value,
            u_kerja: parseInt(document.getElementById('u_kerja').value) || 0,
            u_rusak: parseInt(document.getElementById('u_rusak').value) || 0,
            u_standby: parseInt(document.getElementById('u_standby').value) || 0,
            bahan: document.getElementById('bahan').value,
            dosis: parseFloat(document.getElementById('dosis').value) || 0,
            totalBahan: parseFloat(document.getElementById('totalBahan').value) || 0,
            satuan: document.getElementById('satuan').value,
            catatan: document.getElementById('catatan').value,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection("reports_v13").add(payload);
        clearForm();
    }

    function loadData() {
        const tgl = document.getElementById('tglLaporan').value;
        db.collection("reports_v13").where("tgl", "==", tgl).where("type", "==", currentTab).onSnapshot(snap => {
            let html = ""; let totalHK = 0;
            snap.forEach(doc => {
                const d = doc.data(); totalHK += (d.hk || 0);
                const sumL = d.paddocks.reduce((a, b) => a + b.luas, 0);
                const eff = sumL > 0 ? (d.hk / sumL).toFixed(2) : 0;
                
                html += `<div class="live-card" data-id="${doc.id}">
                    <div style="font-weight:900; color:var(--primary); border-bottom:1px solid #eee; padding-bottom:5px;">${d.kegiatan}</div>
                    <div class="paddock-list-detail" style="background:#f9fafb; padding:5px; border-radius:5px; margin:5px 0;">
                        ${d.paddocks.map(p => `<div class="paddock-item"><span>📍 ${p.name}</span> <b>${p.luas} Ha</b></div>`).join("")}
                        <div style="text-align:right; font-weight:bold; font-size:10px; color:var(--blue);">Total: ${sumL.toFixed(2)} Ha</div>
                    </div>
                    <div class="unit-grid">
                        <div class="unit-box">HK: ${d.hk}</div>
                        <div class="unit-box">HK/Ha: ${eff}</div>
                        <div class="unit-box">Unit: ${d.u_kerja}/${d.u_rusak}/${d.u_standby}</div>
                    </div>
                    <div style="background:#fff7ed; padding:8px; border-radius:8px; border:1px solid #ffedd5; font-size:11px;">
                        🧪 <b>${d.bahan || '-'}</b> | Dosis: ${d.dosis} ${d.satuan}/Ha | Total: <b>${d.totalBahan} ${d.satuan}</b>
                    </div>
                    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
                        <button onclick="editTarik('${doc.id}')" style="background:var(--blue); color:white; border:none; padding:4px 10px; border-radius:5px; font-size:10px;">EDIT</button>
                        <button onclick="hapusSatu('${doc.id}')" style="background:var(--danger); color:white; border:none; padding:4px 8px; border-radius:5px; font-size:10px;">✕</button>
                    </div>
                </div>`;
            });
            document.getElementById('displayList').innerHTML = html;
            document.getElementById('footerTotal').innerText = `TOTAL HK ${currentTab.toUpperCase()}: ${totalHK}`;
        });
    }

    async function loadRekap() {
        const tglAwal = document.getElementById('rekapTglAwal').value;
        const tglAkhir = document.getElementById('rekapTglAkhir').value;
        const type = document.getElementById('filterType').value;
        
        let query = db.collection("reports_v13");
        if(tglAwal) query = query.where("tgl", ">=", tglAwal);
        if(tglAkhir) query = query.where("tgl", "<=", tglAkhir);
        if(type !== "ALL") query = query.where("type", "==", type);
        
        const snap = await query.get();
        let html = "";
        snap.forEach(doc => {
            const d = doc.data();
            const sumL = d.paddocks.reduce((a, b) => a + b.luas, 0);
            html += `<div class="card" style="font-size:11px; border-left:4px solid ${d.type === 'Planning' ? 'var(--warning)' : 'var(--success)'};">
                <b>[${d.type}] ${d.tgl}</b> - ${d.kegiatan}<br>
                Luas: ${sumL.toFixed(2)} Ha | HK: ${d.hk} | Bahan: ${d.bahan} (${d.totalBahan} ${d.satuan})
            </div>`;
        });
        document.getElementById('listRekap').innerHTML = html || "<center>Tidak ada data.</center>";
    }

    function downloadCSV() {
        let csv = "Tanggal,Tipe,Kegiatan,Paddock,Luas,HK,Unit_Kerja,Bahan,Dosis,TotalBahan\n";
        document.querySelectorAll("#listRekap .card").forEach(el => {
            // Ini logika simpel, untuk CSV akurat sebaiknya ambil langsung dari snap data rekap
            alert("Fitur CSV sedang mengekspor data yang terlihat di layar.");
        });
        // Implementasi Blob downloadCSV bisa ditambahkan sesuai kebutuhan spesifik kolom.
    }

    function clearForm() {
        document.getElementById('editId').value = "";
        document.getElementById('hk').value = "";
        document.getElementById('u_kerja').value = 0;
        document.getElementById('u_rusak').value = 0;
        document.getElementById('u_standby').value = 0;
        document.getElementById('dosis').value = "";
        document.getElementById('totalBahan').value = "";
        document.getElementById('catatan').value = "";
        document.getElementById('paddockContainer').innerHTML = `<div class="card" style="background:#f1f5f9; padding:8px; margin-bottom:5px;"><input type="text" class="p-name" placeholder="Paddock" oninput="hitungOtomatis()"><input type="number" class="p-luas" placeholder="Luas (Ha)" step="0.01" oninput="hitungOtomatis()"></div>`;
        document.getElementById('btnUpdate').style.display = "none";
        document.getElementById('btnSimpan').style.display = "block";
    }

    // Init dates
    const tdy = new Date().toISOString().split('T')[0];
    document.getElementById('tglLaporan').value = tdy;
    document.getElementById('rekapTglAwal').value = tdy;
    document.getElementById('rekapTglAkhir').value = tdy;
    switchTab('Dash');
</script>
</body>
</html>
