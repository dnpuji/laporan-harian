<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Upkeep v2.80 - Full Features</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #2d5a27; --bg: #f8fafc; --text: #334155; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --blue: #3b82f6; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; background: var(--bg); color: var(--text); font-size: 13px; padding-bottom: 120px; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 12px; border: 1px solid #e2e8f0; }
        
        .tab-menu { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
        .tab-menu button { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; background: #e2e8f0; font-weight: bold; color: #64748b; font-size: 10px; min-width: 80px; }
        .tab-menu button.active { background: var(--primary); color: white; }

        .unit-input-row { display: grid; grid-template-columns: 1.5fr 0.8fr 0.8fr 0.8fr 35px; gap: 5px; margin-bottom: 8px; }
        .bahan-input-row { display: grid; grid-template-columns: 1.2fr 0.7fr 0.8fr 35px; gap: 5px; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; box-sizing: border-box; }

        .btn-main { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-sm { padding: 6px 10px; border-radius: 6px; border: none; font-size: 10px; cursor: pointer; font-weight: bold; color: white; }
        
        /* Dashboard Activity */
        .act-card { border-left: 4px solid var(--primary); padding: 10px; margin-bottom: 10px; background: #fff; border-radius: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        /* Recap List */
        .recap-item { padding: 12px; border-bottom: 1px solid #eee; position: relative; }
        .badge { position: absolute; right: 10px; top: 10px; padding: 3px 7px; border-radius: 5px; font-size: 9px; color: white; }
    </style>
</head>
<body>

<div class="card" style="text-align:center; padding:10px;">
    <h3 style="margin:0; color:var(--primary);">Upkeep Management v2.80</h3>
</div>

<div class="tab-menu">
    <button id="tabDash" class="active" onclick="switchTab('Dash')">📊 DASHBOARD</button>
    <button id="tabPlanning" onclick="switchTab('Planning')">📋 PLAN</button>
    <button id="tabHasil" onclick="switchTab('Hasil')">✅ HASIL</button>
    <button id="tabRekap" onclick="switchTab('Rekap')">🔎 REKAP</button>
    <button id="tabSet" onclick="switchTab('Set')">⚙️ SETTING</button>
</div>

<div id="viewDash">
    <div class="card"><input type="date" id="tglDash" onchange="loadDashboard()"></div>
    <div id="captureArea"><div id="dashActivityContainer"></div></div>
    <button class="btn-main" style="background:var(--blue)" onclick="downloadDashboard()">📸 DOWNLOAD JPG</button>
</div>

<div id="viewMain" style="display:none;">
    <div class="card">
        <input type="date" id="tglLaporan" onchange="refreshView()">
        <select id="kegiatanSelect"><option value="">-- Pilih Kegiatan --</option></select>
        
        <div id="paddockContainer" style="margin-top:10px;"></div>
        <button onclick="addRowPaddock()" style="font-size:11px; color:var(--blue); border:none; background:none;">+ Tambah Paddock</button>

        <div id="unitContainer" style="margin-top:10px;"></div>
        <button onclick="addRowUnit()" style="font-size:11px; color:var(--blue); border:none; background:none;">+ Tambah Unit</button>

        <div id="bahanContainer" style="margin-top:10px;"></div>
        <button onclick="addRowBahan()" style="font-size:11px; color:var(--blue); border:none; background:none;">+ Tambah Bahan</button>

        <input type="number" id="hk" placeholder="Total HK" style="margin-top:10px;">
        <textarea id="catatan" placeholder="Catatan..."></textarea>
        <button class="btn-main" onclick="simpanData()">💾 SIMPAN DATA</button>
    </div>
    <div id="displayList"></div>
</div>

<div id="viewRekap" style="display:none;">
    <div class="card">
        <div class="grid-2">
            <input type="date" id="tglRekap" onchange="loadRekap()">
            <button onclick="downloadCSV()" style="background:var(--success); color:white; border:none; border-radius:8px;">📥 CSV (EXCEL)</button>
        </div>
    </div>
    <div id="listRekap" class="card" style="padding:0;"></div>
</div>

<div id="viewSet" style="display:none;">
    <div class="card">
        <input type="text" id="newMaster" placeholder="Nama item baru...">
        <div class="grid-2" style="margin-top:10px;">
            <button onclick="addMaster('kegiatan')" style="background:var(--primary); color:white; border:none; padding:10px; border-radius:8px;">+ KEGIATAN</button>
            <button onclick="addMaster('bahan')" style="background:var(--blue); color:white; border:none; padding:10px; border-radius:8px;">+ BAHAN</button>
        </div>
        <div id="masterList" style="margin-top:15px; border-top:1px solid #eee;"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAgxUFI0NSD-7Ka8ZxFJwkupR6rgb_i00w",
        authDomain: "monitoring-upkeep.firebaseapp.com",
        projectId: "monitoring-upkeep",
        storageBucket: "monitoring-upkeep.firebasestorage.app",
        messagingSenderId: "631929326010",
        appId: "1:631929326010:web:8f9263c2a9281ef7ff7583"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let masterKegiatan = [];
    let masterBahan = [];

    function switchTab(t) {
        document.querySelectorAll('.tab-menu button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab'+t).classList.add('active');
        ['viewMain', 'viewDash', 'viewRekap', 'viewSet'].forEach(v => document.getElementById(v).style.display = 'none');
        
        if(t === 'Planning' || t === 'Hasil') {
            document.getElementById('viewMain').style.display = 'block';
            refreshView();
        } else {
            document.getElementById('view'+t).style.display = 'block';
        }
        if(t === 'Dash') loadDashboard();
        if(t === 'Rekap') loadRekap();
        if(t === 'Set') loadMasterData();
    }

    // --- LOGIC REKAP & CSV ---
    async function loadRekap() {
        const tgl = document.getElementById('tglRekap').value;
        const snap = await db.collection("reports_v15").where("tgl", "==", tgl).get();
        let html = "";
        snap.forEach(doc => {
            const d = doc.data();
            const color = d.type === 'Planning' ? 'var(--blue)' : 'var(--success)';
            html += `<div class="recap-item">
                <span class="badge" style="background:${color}">${d.type}</span>
                <b>${d.kegiatan}</b><br>
                <small>${d.paddocks.map(p => p.name).join(", ")} (${d.paddocks.reduce((a,b)=>a+b.luas,0).toFixed(2)} Ha)</small>
                <div style="margin-top:5px;"><button onclick="hapusData('${doc.id}')" style="color:red; background:none; border:none; font-size:10px;">HAPUS PERMANEN</button></div>
            </div>`;
        });
        document.getElementById('listRekap').innerHTML = html || "<p style='padding:20px;text-align:center;'>Data Kosong</p>";
    }

    async function downloadCSV() {
        const tgl = document.getElementById('tglRekap').value;
        const snap = await db.collection("reports_v15").where("tgl", "==", tgl).get();
        let csv = "Tanggal,Tipe,Kegiatan,Paddock,Luas_Ha,HK,Bahan_Dosis\n";
        
        snap.forEach(doc => {
            const d = doc.data();
            const pads = d.paddocks.map(p => p.name).join("|");
            const luas = d.paddocks.reduce((a,b)=>a+b.luas,0);
            const mats = d.materials.map(m => `${m.nama}(${m.dosis}${m.satuan})`).join("|");
            csv += `${d.tgl},${d.type},${d.kegiatan},${pads},${luas},${d.hk},${mats}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('hidden', '');
        a.setAttribute('href', url);
        a.setAttribute('download', `Rekap_Upkeep_${tgl}.csv`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // --- COPY FUNCTIONS ---
    async function copyToWA(data) {
        let text = `*LAPORAN ${data.type.toUpperCase()} - ${data.tgl}*\n`;
        text += `Kegiatan: ${data.kegiatan}\n`;
        text += `Lokasi: ${data.paddocks.map(p => p.name + " (" + p.luas + "Ha)").join(", ")}\n`;
        text += `Tenaga Kerja: ${data.hk} HK\n`;
        text += `Unit: ${data.units.map(u => u.nama + "(K:"+u.kerja+"/S:"+u.stby+"/R:"+u.rusak+")").join(", ")}\n`;
        text += `Bahan: ${data.materials.map(m => m.nama + " (" + m.dosis + m.satuan + ")").join(", ")}\n`;
        if(data.catatan) text += `Catatan: ${data.catatan}`;
        
        await navigator.clipboard.writeText(text);
        alert("Berhasil Copy ke WA!");
    }

    async function copyToHasil(data) {
        if(confirm("Salin Plan ini ke menu HASIL?")) {
            const newData = {...data, type: 'Hasil', updatedAt: firebase.firestore.FieldValue.serverTimestamp()};
            await db.collection("reports_v15").add(newData);
            alert("Berhasil disalin ke HASIL!");
            switchTab('Hasil');
        }
    }

    // --- DYNAMIC ROWS ---
    function addRowBahan(n="", d="", s="Kg") {
        const div = document.createElement('div'); div.className = 'bahan-input-row';
        let opts = masterBahan.map(b => `<option value="${b.nama}" ${b.nama===n?'selected':''}>${b.nama}</option>`).join("");
        div.innerHTML = `
            <select class="b-nama"><option value="">Bahan...</option>${opts}</select>
            <input type="number" class="b-dosis" value="${d}" placeholder="Dosis">
            <select class="b-satuan">
                <option value="Kg" ${s==='Kg'?'selected':''}>Kg</option>
                <option value="L" ${s==='L'?'selected':''}>L</option>
                <option value="Gram" ${s==='Gram'?'selected':''}>Gram</option>
                <option value="mL" ${s==='mL'?'selected':''}>mL</option>
                <option value="pcs" ${s==='pcs'?'selected':''}>pcs</option>
            </select>
            <button onclick="this.parentElement.remove()" style="color:red; border:none; background:none;">✕</button>`;
        document.getElementById('bahanContainer').appendChild(div);
    }

    // (Fungsi addRowPaddock, addRowUnit, simpanData, loadMasterData dsb sama seperti v2.70 dengan penyesuaian)
    function addRowPaddock(n="", l="") {
        const div = document.createElement('div'); div.className = 'grid-2'; div.style.marginBottom="5px";
        div.innerHTML = `<input type="text" class="p-name" value="${n}" placeholder="Paddock"><input type="number" class="p-luas" value="${l}" placeholder="Ha" step="0.01">`;
        document.getElementById('paddockContainer').appendChild(div);
    }

    function addRowUnit(n="", k=0, s=0, r=0) {
        const div = document.createElement('div'); div.className = 'unit-input-row';
        div.innerHTML = `<input type="text" class="u-nama" value="${n}" placeholder="Unit"><input type="number" class="u-kerja" value="${k}"><input type="number" class="u-stby" value="${s}"><input type="number" class="u-rusak" value="${r}"><button onclick="this.parentElement.remove()" style="color:red; border:none; background:none;">✕</button>`;
        document.getElementById('unitContainer').appendChild(div);
    }

    async function simpanData() {
        const type = document.querySelector('.tab-menu button.active').innerText.includes('PLAN') ? 'Planning' : 'Hasil';
        const payload = {
            tgl: document.getElementById('tglLaporan').value,
            type: type,
            kegiatan: document.getElementById('kegiatanSelect').value,
            hk: parseInt(document.getElementById('hk').value) || 0,
            catatan: document.getElementById('catatan').value,
            paddocks: Array.from(document.querySelectorAll('.p-name')).map((el, i) => ({
                name: el.value, luas: parseFloat(document.querySelectorAll('.p-luas')[i].value) || 0
            })).filter(p => p.name !== ""),
            units: Array.from(document.querySelectorAll('.u-nama')).map((el, i) => ({
                nama: el.value,
                kerja: parseInt(document.querySelectorAll('.u-kerja')[i].value) || 0,
                stby: parseInt(document.querySelectorAll('.u-stby')[i].value) || 0,
                rusak: parseInt(document.querySelectorAll('.u-rusak')[i].value) || 0
            })).filter(u => u.nama !== ""),
            materials: Array.from(document.querySelectorAll('.b-nama')).map((el, i) => ({
                nama: el.value,
                dosis: parseFloat(document.querySelectorAll('.b-dosis')[i].value) || 0,
                satuan: document.querySelectorAll('.b-satuan')[i].value
            })).filter(m => m.nama !== "")
        };
        await db.collection("reports_v15").add(payload);
        alert("Data Berhasil Disimpan!");
        refreshView();
    }

    function refreshView() {
        const tgl = document.getElementById('tglLaporan').value;
        const type = document.querySelector('.tab-menu button.active').innerText.includes('PLAN') ? 'Planning' : 'Hasil';
        db.collection("reports_v15").where("tgl", "==", tgl).where("type", "==", type).onSnapshot(snap => {
            let h = "";
            snap.forEach(doc => {
                const d = doc.data();
                h += `<div class="card" style="border-left:5px solid var(--primary)">
                    <div style="display:flex; justify-content:space-between;"><b>${d.kegiatan}</b> <span>${d.hk} HK</span></div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <button class="btn-sm" style="background:var(--success)" onclick='copyToWA(${JSON.stringify(d)})'>COPY WA</button>
                        ${type==='Planning' ? `<button class="btn-sm" style="background:var(--blue)" onclick='copyToHasil(${JSON.stringify(d)})'>COPY KE HASIL</button>` : ''}
                        <button class="btn-sm" style="background:var(--danger)" onclick="hapusData('${doc.id}')">HAPUS</button>
                    </div>
                </div>`;
            });
            document.getElementById('displayList').innerHTML = h;
        });
    }

    async function loadMasterData() {
        const sk = await db.collection("master_kegiatan").get();
        masterKegiatan = sk.docs.map(d => ({id:d.id, nama:d.data().nama, type:'kegiatan'}));
        const sb = await db.collection("master_bahan").get();
        masterBahan = sb.docs.map(d => ({id:d.id, nama:d.data().nama, type:'bahan'}));
        
        let html = [...masterKegiatan, ...masterBahan].map(m => `
            <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #eee;">
                <span>[${m.type}] ${m.nama}</span>
                <button onclick="deleteMaster('${m.type}','${m.id}')" style="color:red; border:none; background:none;">✕</button>
            </div>`).join("");
        document.getElementById('masterList').innerHTML = html;
        
        let opt = `<option value="">-- Pilih Kegiatan --</option>`;
        masterKegiatan.forEach(k => opt += `<option value="${k.nama}">${k.nama}</option>`);
        document.getElementById('kegiatanSelect').innerHTML = opt;
    }

    async function addMaster(type) {
        const val = document.getElementById('newMaster').value;
        if(!val) return;
        await db.collection("master_"+type).add({nama: val});
        document.getElementById('newMaster').value = "";
        loadMasterData();
    }

    async function deleteMaster(type, id) {
        await db.collection("master_"+type).doc(id).delete();
        loadMasterData();
    }

    async function hapusData(id) { if(confirm("Hapus?")) await db.collection("reports_v15").doc(id).delete(); }

    // Init
    const today = new Date().toISOString().split('T')[0];
    ['tglLaporan', 'tglDash', 'tglRekap'].forEach(id => document.getElementById(id).value = today);
    loadMasterData();
    switchTab('Dash');
</script>
</body>
</html>
