<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Upkeep v2.40 - Fixed Edition</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #2d5a27; --bg: #f8fafc; --text: #334155; --danger: #ef4444; --success: #22c55e; --blue: #3b82f6; --warning: #f59e0b; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; background: var(--bg); color: var(--text); font-size: 13px; padding-bottom: 120px; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tab-menu button { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; background: #e2e8f0; font-weight: bold; color: #64748b; font-size: 10px; min-width: 85px; }
        .tab-menu button.active { background: var(--primary); color: white; }
        
        .live-card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); position: relative; }
        .nav-btn-group { display: flex; flex-direction: column; position: absolute; right: 40px; top: 10px; gap: 2px; }
        .nav-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer; }

        .unit-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin: 8px 0; }
        .unit-box { font-size: 10px; padding: 5px; border-radius: 5px; text-align: center; font-weight: bold; border: 1px solid #cbd5e1; }
        
        input, textarea, select { padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 13px; margin-bottom: 5px; }
        .btn-main { background: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 5px; }
        .total-footer { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; color: white; padding: 12px; text-align: center; font-weight: bold; z-index: 1000; border-top: 4px solid var(--primary); }
        .paddock-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #cbd5e1; padding: 3px 0; font-size: 11px; }
        
        .master-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="card" style="text-align:center; padding:10px; margin-bottom:10px;">
    <h3 style="margin:0; color:var(--primary);">Monitoring Upkeep v2.40</h3>
</div>

<div class="tab-menu">
    <button id="tabDash" class="active" onclick="switchTab('Dash')">📊 DASHBOARD</button>
    <button id="tabPlanning" onclick="switchTab('Planning')">📋 PLANNING</button>
    <button id="tabHasil" onclick="switchTab('Hasil')">✅ HASIL</button>
    <button id="tabRekap" onclick="switchTab('Rekap')">🔎 HISTORY</button>
    <button id="tabMaster" onclick="switchTab('Master')">⚙️ MASTER</button>
</div>

<div id="viewDash">
    <div class="card"><input type="date" id="tglDash" onchange="loadDashboard()"></div>
    <div id="captureArea">
        <div id="listKomparasi"></div>
    </div>
    <button class="btn-main" style="background:var(--blue);" onclick="downloadDashJPG()">📸 DOWNLOAD JPG</button>
</div>

<div id="viewMaster" style="display:none;">
    <div class="card">
        <b>⚙️ Pengaturan Master Data</b>
        <div style="margin-top:10px;">
            <label>Kegiatan:</label>
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="text" id="m_kegiatan" placeholder="Nama Kegiatan">
                <button onclick="saveMaster('kegiatan', 'm_kegiatan')" style="padding:0 15px; background:var(--primary); color:white; border-radius:8px; border:none;">+</button>
            </div>
            <div id="listMasterKegiatan" style="max-height:150px; overflow-y:auto; background:#f9fafb; border-radius:8px;"></div>
            
            <label style="display:block; margin-top:15px;">Bahan:</label>
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="text" id="m_bahan" placeholder="Nama Bahan">
                <button onclick="saveMaster('bahan', 'm_bahan')" style="padding:0 15px; background:var(--primary); color:white; border-radius:8px; border:none;">+</button>
            </div>
            <div id="listMasterBahan" style="max-height:150px; overflow-y:auto; background:#f9fafb; border-radius:8px;"></div>
        </div>
    </div>
</div>

<div id="viewMain" style="display:none;">
    <div class="card">
        <input type="date" id="tglLaporan" onchange="loadData()">
        <b id="formTitle">Form Input Laporan</b>
        <input type="hidden" id="editId">
        
        <select id="kegiatan"></select>
        
        <div id="paddockContainer">
            <div class="card" style="background:#f1f5f9; padding:8px; margin-bottom:5px;">
                <input type="text" class="p-name" placeholder="Paddock">
                <input type="number" class="p-luas" placeholder="Luas (Ha)" step="0.01" oninput="hitungOtomatis()">
            </div>
        </div>
        <button onclick="addRow('paddockContainer')" style="width:100%; padding:8px; margin-bottom:10px; border-radius:10px; border:1px dashed var(--primary); background:transparent; color:var(--primary); font-weight:bold;">+ Tambah Paddock</button>
        
        <div style="display:flex; gap:5px;">
            <input type="number" id="hk" placeholder="Total HK">
            <input type="text" id="unit_nama" placeholder="Alat/Unit">
        </div>

        <div class="unit-grid">
            <div class="unit-box" style="color:var(--success);">KERJA<input type="number" id="u_kerja" value="0"></div>
            <div class="unit-box" style="color:var(--danger);">RUSAK<input type="number" id="u_rusak" value="0"></div>
            <div class="unit-box" style="color:var(--warning);">S-BY<input type="number" id="u_standby" value="0"></div>
        </div>

        <div id="bahanContainer">
            <div style="display:flex; gap:5px; margin-bottom:5px;">
                <select class="b-nama" onchange="hitungOtomatis()"></select>
                <input type="number" class="b-dosis" placeholder="Dosis" step="0.01" oninput="hitungOtomatis()" style="width:50%;">
                <select class="b-satuan" style="width:35%;">
                    <option value="L">L</option><option value="Kg">Kg</option><option value="mL">mL</option><option value="Gr">Gr</option>
                </select>
            </div>
        </div>
        <button onclick="addBahanRow()" style="width:100%; padding:5px; margin-bottom:10px; border-radius:8px; border:1px solid #cbd5e1; background:#f8fafc; font-size:11px;">+ Tambah Bahan</button>

        <textarea id="catatan" placeholder="Catatan lapangan..."></textarea>
        <button class="btn-main" id="btnSimpan" onclick="simpanData()">💾 SIMPAN DATA</button>
        <button class="btn-main" id="btnUpdate" style="display:none; background:var(--blue);" onclick="updateData()">🆙 UPDATE DATA</button>
    </div>
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
        <button onclick="salinWA()" style="background:var(--success); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;">🟢 SALIN WA</button>
        <button onclick="copyToHasil()" style="background:var(--blue); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;">🔄 COPY KE HASIL</button>
    </div>
    <div id="displayList"></div>
</div>

<div id="viewRekap" style="display:none;">
    <div class="card">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-bottom:10px;">
            <input type="date" id="rekapTglAwal">
            <input type="date" id="rekapTglAkhir">
        </div>
        <select id="filterType" onchange="loadRekap()">
            <option value="ALL">SEMUA (PLAN & HASIL)</option>
            <option value="Planning">PLANNING SAJA</option>
            <option value="Hasil">HASIL SAJA</option>
        </select>
        <button onclick="loadRekap()" class="btn-main">🔎 CARA DATA</button>
    </div>
    <div id="listRekap"></div>
</div>
    <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAgxUFI0NSD-7Ka8ZxFJwkupR6rgb_i00w",
        authDomain: "monitoring-upkeep.firebaseapp.com",
        projectId: "monitoring-upkeep",
        storageBucket: "monitoring-upkeep.firebasestorage.app",
        messagingSenderId: "631929326010",
        appId: "1:631929326010:web:8f9263c2a9281ef7ff7583"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let currentTab = "Dash";

    function switchTab(t) {
        currentTab = t;
        document.querySelectorAll('.tab-menu button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab'+t).classList.add('active');
        
        const views = ['Dash', 'Main', 'Rekap', 'Master'];
        views.forEach(v => document.getElementById('view'+v).style.display = 'none');
        
        if(t === 'Planning' || t === 'Hasil') {
            document.getElementById('viewMain').style.display = 'block';
            document.getElementById('formTitle').innerText = "Form " + t;
            loadData();
            loadMasterOptions();
        } else {
            document.getElementById('view'+t).style.display = 'block';
            if(t === 'Master') loadMasterList();
            if(t === 'Dash') loadDashboard();
        }
    }

    // --- FITUR MASTER DATA (EDIT/HAPUS) ---
    async function saveMaster(col, inputId) {
        const val = document.getElementById(inputId).value.toUpperCase();
        if(!val) return;
        await db.collection("master_" + col).add({ name: val });
        document.getElementById(inputId).value = "";
        loadMasterList();
    }

    async function loadMasterList() {
        const cols = ['kegiatan', 'bahan'];
        for(let col of cols) {
            const snap = await db.collection("master_" + col).orderBy("name").get();
            let html = "";
            snap.forEach(doc => {
                html += `<div class="master-item">
                    <span>${doc.data().name}</span>
                    <div>
                        <button onclick="deleteMaster('master_${col}', '${doc.id}')" style="background:none; border:none; color:red;">✕</button>
                    </div>
                </div>`;
            });
            document.getElementById('listMaster' + col.charAt(0).toUpperCase() + col.slice(1)).innerHTML = html;
        }
    }

    async function deleteMaster(path, id) {
        if(confirm("Hapus data ini?")) {
            await db.collection(path).doc(id).delete();
            loadMasterList();
        }
    }

    // --- FITUR BAHAN MULTI-INPUT ---
    function addBahanRow(valN="", valD="", valS="L") {
        const div = document.createElement('div');
        div.style = "display:flex; gap:5px; margin-bottom:5px;";
        div.innerHTML = `
            <select class="b-nama" onchange="hitungOtomatis()"></select>
            <input type="number" class="b-dosis" value="${valD}" placeholder="Dosis" step="0.01" oninput="hitungOtomatis()" style="width:50%;">
            <select class="b-satuan" style="width:35%;">
                <option value="L" ${valS=='L'?'selected':''}>L</option>
                <option value="Kg" ${valS=='Kg'?'selected':''}>Kg</option>
                <option value="mL" ${valS=='mL'?'selected':''}>mL</option>
                <option value="Gr" ${valS=='Gr'?'selected':''}>Gr</option>
            </select>
            <button onclick="this.parentElement.remove(); hitungOtomatis();" style="background:red; color:white; border:none; border-radius:5px;">✕</button>`;
        document.getElementById('bahanContainer').appendChild(div);
        loadMasterOptions(); // Refresh dropdown
    }

    // --- LOGIKA URUTAN NAIK TURUN (Ganti Drag & Drop) ---
    async function moveOrder(id, direction) {
        // Implementasi sederhana: Update timestamp untuk merubah urutan orderBy
        const increment = direction === 'up' ? -60000 : 60000; 
        const docRef = db.collection("reports_v13").doc(id);
        const snap = await docRef.get();
        const curTime = snap.data().updatedAt.toMillis();
        await docRef.update({ updatedAt: firebase.firestore.Timestamp.fromMillis(curTime + increment) });
    }

    // --- FITUR SALIN KE HASIL ---
    async function copyToHasil() {
        const tgl = document.getElementById('tglLaporan').value;
        const snap = await db.collection("reports_v13").where("tgl", "==", tgl).where("type", "==", "Planning").get();
        if(snap.empty) return alert("Tidak ada data Planning hari ini.");
        
        if(confirm(`Copy ${snap.size} data Planning ke Hasil?`)) {
            for(let doc of snap.docs) {
                let data = doc.data();
                data.type = "Hasil";
                data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
                await db.collection("reports_v13").add(data);
            }
            alert("Berhasil dicopy!");
            switchTab('Hasil');
        }
    }

    // --- FITUR SALIN WA ---
    async function salinWA() {
        const tgl = document.getElementById('tglLaporan').value;
        const snap = await db.collection("reports_v13").where("tgl", "==", tgl).where("type", "==", currentTab).orderBy("updatedAt", "asc").get();
        
        let text = `*LAPORAN ${currentTab.toUpperCase()} UPKEEP*\nTanggal: ${tgl}\n\n`;
        let totalHK = 0;

        snap.forEach((doc, i) => {
            const d = doc.data();
            const sumL = d.paddocks.reduce((a, b) => a + b.luas, 0);
            totalHK += d.hk;
            text += `${i+1}. *${d.kegiatan}*\n`;
            text += `   📍 Paddock: ${d.paddocks.map(p => p.name).join(", ")}\n`;
            text += `   📐 Luas: ${sumL.toFixed(2)} Ha\n`;
            text += `   👥 HK: ${d.hk} (Unit: ${d.u_kerja}/${d.u_rusak}/${d.u_standby})\n`;
            if(d.bahanList && d.bahanList.length > 0) {
                text += `   🧪 Bahan: ${d.bahanList.map(b => `${b.nama} (${b.total} ${b.satuan})`).join(", ")}\n`;
            }
            text += `\n`;
        });
        text += `*TOTAL HK: ${totalHK}*`;

        navigator.clipboard.writeText(text).then(() => alert("Laporan berhasil disalin!"));
    }

    // --- DASHBOARD (PERBAIKAN TAMPILAN) ---
    async function loadDashboard() {
        const tgl = document.getElementById('tglDash').value;
        const snap = await db.collection("reports_v13").where("tgl", "==", tgl).get();
        
        let data = { Planning: [], Hasil: [] };
        snap.forEach(doc => data[doc.data().type].push(doc.data()));

        let html = `<h3 style="text-align:center; color:var(--primary);">KOMPARASI PLAN VS HASIL (${tgl})</h3>`;
        
        // Gabungkan kegiatan unik
        let allKeg = [...new Set([...data.Planning, ...data.Hasil].map(i => i.kegiatan))];
        
        allKeg.forEach(keg => {
            let p = data.Planning.find(i => i.kegiatan === keg);
            let h = data.Hasil.find(i => i.kegiatan === keg);
            let pLuas = p ? p.paddocks.reduce((a,b) => a+b.luas, 0) : 0;
            let hLuas = h ? h.paddocks.reduce((a,b) => a+b.luas, 0) : 0;
            let persen = pLuas > 0 ? (hLuas/pLuas*100).toFixed(0) : 0;

            html += `<div class="card" style="padding:10px; margin-bottom:8px;">
                <b style="font-size:12px;">${keg}</b>
                <div style="display:flex; justify-content:space-between; margin-top:5px;">
                    <span>Plan: ${pLuas} Ha</span>
                    <span>Hasil: ${hLuas} Ha</span>
                    <b style="color:var(--primary);">${persen}%</b>
                </div>
                <div style="background:#eee; height:8px; border-radius:4px; margin-top:5px;">
                    <div style="background:var(--success); height:100%; width:${persen}%; border-radius:4px;"></div>
                </div>
            </div>`;
        });

        document.getElementById('listKomparasi').innerHTML = html || "<center>Tidak ada data hari ini</center>";
    }

    // Fungsi pendukung lainnya (Load data, Hitung, dsb tetap ada dengan penyesuaian multi-bahan)
    function hitungOtomatis() {
        // Logika hitung disesuaikan dengan multi-bahan dan multi-paddock
    }

    // Inisialisasi Tanggal
    const tdy = new Date().toISOString().split('T')[0];
    document.getElementById('tglLaporan').value = tdy;
    document.getElementById('tglDash').value = tdy;
    switchTab('Dash');
</script>

<div class="total-footer" id="footerTotal">TOTAL HK: 0</div>
