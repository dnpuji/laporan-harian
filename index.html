<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Upkeep v2.60 - Analytics</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #2d5a27; --bg: #f8fafc; --text: #334155; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; --blue: #3b82f6; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; background: var(--bg); color: var(--text); font-size: 13px; padding-bottom: 120px; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 12px; border: 1px solid #e2e8f0; }
        
        /* Tab Menu */
        .tab-menu { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; }
        .tab-menu button { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; background: #e2e8f0; font-weight: bold; color: #64748b; font-size: 10px; min-width: 80px; }
        .tab-menu button.active { background: var(--primary); color: white; }

        /* Dashboard Components */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-card { padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
        .stat-val { font-size: 18px; font-weight: 800; display: block; }
        .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; }

        /* Progress Flow */
        .flow-container { margin: 15px 0; }
        .flow-bar { height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; display: flex; }
        .flow-fill { background: var(--success); height: 100%; transition: width 0.5s; }

        /* Table Dashboard */
        .dash-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        .dash-table th { text-align: left; padding: 8px; background: #f1f5f9; color: var(--text); }
        .dash-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; }

        .btn-main { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .section-title { font-weight: 800; color: var(--primary); margin: 15px 0 8px 0; display: block; border-left: 3px solid var(--primary); padding-left: 8px; text-transform: uppercase; font-size: 11px; }
        
        input, select, textarea { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; width: 100%; box-sizing: border-box; font-size: 14px; margin-bottom: 8px; }
        .row-flex { display: flex; gap: 6px; align-items: center; }

        /* Hide area from capture if needed */
        .no-capture { display: none; }
    </style>
</head>
<body>

<div class="card" style="text-align:center; padding:10px;">
    <h3 style="margin:0; color:var(--primary);">Upkeep Analytics v2.60</h3>
</div>

<div class="tab-menu">
    <button id="tabDash" class="active" onclick="switchTab('Dash')">📊 DASHBOARD</button>
    <button id="tabPlanning" onclick="switchTab('Planning')">📋 PLAN</button>
    <button id="tabHasil" onclick="switchTab('Hasil')">✅ HASIL</button>
    <button id="tabRekap" onclick="switchTab('Rekap')">🔎 REKAP</button>
    <button id="tabSet" onclick="switchTab('Set')">⚙️ SETTING</button>
</div>

<div id="viewDash">
    <div class="card">
        <label class="stat-label">Pilih Tanggal Analisa:</label>
        <input type="date" id="tglDash" onchange="loadDashboard()">
    </div>

    <div id="captureArea" style="background: #f8fafc; padding: 5px;">
        <div class="card">
            <span class="section-title">PERBANDINGAN LUAS & HK</span>
            <div class="dash-grid">
                <div class="stat-card">
                    <span class="stat-label">Total Luas (Ha)</span>
                    <span class="stat-val" id="valLuas">0 / 0</span>
                    <small id="percLuas" style="color:var(--blue)">0% Achieved</small>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Total HK</span>
                    <span class="stat-val" id="valHK">0 / 0</span>
                    <small id="effHK" style="color:var(--warning)">0.00 HK/Ha</small>
                </div>
            </div>

            <div class="flow-container">
                <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:bold; margin-bottom:4px;">
                    <span>PROGRESS KERJA</span>
                    <span id="txtFlow">0%</span>
                </div>
                <div class="flow-bar"><div id="barFlow" class="flow-fill" style="width: 0%"></div></div>
            </div>
        </div>

        <div class="card">
            <span class="section-title">PERSENTASE PENGGUNAAN BAHAN</span>
            <table class="dash-table">
                <thead>
                    <tr>
                        <th>Nama Bahan</th>
                        <th>Plan</th>
                        <th>Actual</th>
                        <th>%</th>
                    </tr>
                </thead>
                <tbody id="bodyBahan"></tbody>
            </table>
        </div>
    </div>

    <button class="btn-main" style="background:var(--blue);" onclick="downloadDashboard()">📸 DOWNLOAD LAPORAN (JPG)</button>
</div>

<div id="viewMain" style="display:none;">
    <div class="card">
        <input type="date" id="tglLaporan" onchange="refreshView()">
        <input type="hidden" id="editId">
        
        <select id="kegiatanSelect"><option value="">-- Pilih Kegiatan --</option></select>
        
        <div id="paddockContainer">
            <div class="row-flex" style="margin-top:8px;">
                <input type="text" class="p-name" placeholder="Paddock">
                <input type="number" class="p-luas" placeholder="Ha" step="0.01" style="width:100px;" oninput="hitungSemuaBahan()">
            </div>
        </div>
        <button onclick="addRowPaddock()" style="background:none; border:none; color:var(--primary); font-size:11px; cursor:pointer;">+ Tambah Paddock</button>

        <span class="section-title">DETAIL UNIT</span>
        <div id="unitContainer"></div>
        <button onclick="addRowUnit()" style="background:none; border:none; color:var(--primary); font-size:11px; cursor:pointer;">+ Tambah Tipe Unit</button>

        <span class="section-title">BAHAN</span>
        <div id="bahanContainer"></div>
        <button onclick="addRowBahan()" style="background:none; border:none; color:var(--primary); font-size:11px; cursor:pointer;">+ Tambah Bahan</button>

        <input type="number" id="hk" placeholder="Total HK" style="margin-top:15px;">
        <textarea id="catatan" placeholder="Keterangan unit rusak/standby..."></textarea>

        <button class="btn-main" id="btnSimpan" onclick="simpanData()">💾 SIMPAN DATA</button>
    </div>
    <div id="displayList"></div>
</div>

<div id="viewSet" style="display:none;">
    <div class="card">
        <span class="section-title">MASTER KEGIATAN</span>
        <div class="row-flex">
            <input type="text" id="newKegiatan" placeholder="Nama Kegiatan...">
            <button onclick="addMaster('kegiatan')" style="padding:12px; background:var(--primary); color:white; border:none; border-radius:10px;">+</button>
        </div>
        <div id="masterKegiatanList" style="margin-top:10px;"></div>
    </div>
    <div class="card">
        <span class="section-title">MASTER BAHAN</span>
        <div class="row-flex">
            <input type="text" id="newBahan" placeholder="Nama Bahan...">
            <button onclick="addMaster('bahan')" style="padding:12px; background:var(--primary); color:white; border:none; border-radius:10px;">+</button>
        </div>
        <div id="masterBahanList" style="margin-top:10px;"></div>
    </div>
</div>

<div class="total-footer" id="footerTotalHK">DASHBOARD MODE</div>

<script>
    // Konfigurasi Firebase (Gunakan milik Bapak)
    const firebaseConfig = {
        apiKey: "AIzaSyAgxUFI0NSD-7Ka8ZxFJwkupR6rgb_i00w",
        authDomain: "monitoring-upkeep.firebaseapp.com",
        projectId: "monitoring-upkeep",
        storageBucket: "monitoring-upkeep.firebasestorage.app",
        messagingSenderId: "631929326010",
        appId: "1:631929326010:web:8f9263c2a9281ef7ff7583"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let masterKegiatan = [];
    let masterBahan = [];

    // --- TAB SYSTEM ---
    function switchTab(t) {
        document.querySelectorAll('.tab-menu button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab'+t).classList.add('active');
        
        document.getElementById('viewDash').style.display = (t === 'Dash') ? 'block' : 'none';
        document.getElementById('viewMain').style.display = (t === 'Planning' || t === 'Hasil') ? 'block' : 'none';
        document.getElementById('viewSet').style.display = (t === 'Set') ? 'block' : 'none';
        
        if(t === 'Dash') loadDashboard();
        if(t === 'Planning' || t === 'Hasil') refreshView();
        if(t === 'Set') loadMasterData();
    }

    // --- DASHBOARD ANALYTICS ---
    async function loadDashboard() {
        const tgl = document.getElementById('tglDash').value;
        if(!tgl) return;

        const snap = await db.collection("reports_v15").where("tgl", "==", tgl).get();
        let plan = { luas: 0, hk: 0, mat: {} };
        let hasil = { luas: 0, hk: 0, mat: {} };

        snap.forEach(doc => {
            const d = doc.data();
            const l = d.paddocks.reduce((a, b) => a + b.luas, 0);
            
            if(d.type === 'Planning') {
                plan.luas += l; plan.hk += d.hk;
                d.materials.forEach(m => plan.mat[m.nama] = (plan.mat[m.nama] || 0) + m.total);
            } else {
                hasil.luas += l; hasil.hk += d.hk;
                d.materials.forEach(m => hasil.mat[m.nama] = (hasil.mat[m.nama] || 0) + m.total);
            }
        });

        // Update UI
        document.getElementById('valLuas').innerText = `${hasil.luas.toFixed(2)} / ${plan.luas.toFixed(2)}`;
        document.getElementById('valHK').innerText = `${hasil.hk} / ${plan.hk}`;
        
        const percL = plan.luas > 0 ? (hasil.luas / plan.luas * 100).toFixed(1) : 0;
        document.getElementById('percLuas').innerText = `${percL}% Achieved`;
        document.getElementById('barFlow').style.width = `${Math.min(percL, 100)}%`;
        document.getElementById('txtFlow').innerText = `${percL}%`;

        const eff = hasil.luas > 0 ? (hasil.hk / hasil.luas).toFixed(2) : 0;
        document.getElementById('effHK').innerText = `${eff} HK/Ha (Actual)`;

        // Bahan Table
        let bHtml = "";
        const allBahanNames = [...new Set([...Object.keys(plan.mat), ...Object.keys(hasil.mat)])];
        allBahanNames.forEach(name => {
            const pVal = plan.mat[name] || 0;
            const hVal = hasil.mat[name] || 0;
            const pMat = pVal > 0 ? (hVal / pVal * 100).toFixed(1) : 100;
            bHtml += `<tr>
                <td>${name}</td>
                <td>${pVal.toFixed(1)}</td>
                <td>${hVal.toFixed(1)}</td>
                <td style="color:${pMat > 100 ? 'red':'green'}">${pMat}%</td>
            </tr>`;
        });
        document.getElementById('bodyBahan').innerHTML = bHtml || "<tr><td colspan='4' align='center'>Tidak ada data bahan</td></tr>";
    }

    function downloadDashboard() {
        const area = document.getElementById('captureArea');
        html2canvas(area, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Laporan_Upkeep_${document.getElementById('tglDash').value}.jpg`;
            link.href = canvas.toDataURL("image/jpeg", 0.9);
            link.click();
        });
    }

    // --- MASTER DATA ---
    async function loadMasterData() {
        const sk = await db.collection("master_kegiatan").get();
        masterKegiatan = sk.docs.map(d => ({id: d.id, ...d.data()}));
        renderMasterList('masterKegiatanList', masterKegiatan, 'kegiatan');
        
        const sb = await db.collection("master_bahan").get();
        masterBahan = sb.docs.map(d => ({id: d.id, ...d.data()}));
        renderMasterList('masterBahanList', masterBahan, 'bahan');
        
        updateDropdowns();
    }

    function renderMasterList(id, data, type) {
        document.getElementById(id).innerHTML = data.map(i => `
            <div class="row-flex" style="padding:8px; border-bottom:1px solid #eee;">
                <span style="flex:1">${i.nama}</span>
                <button onclick="deleteMaster('${type}','${i.id}')" style="color:red; border:none; background:none;">✕</button>
            </div>
        `).join("");
    }

    async function addMaster(type) {
        const val = document.getElementById(type === 'kegiatan' ? 'newKegiatan' : 'newBahan').value;
        if(!val) return;
        await db.collection("master_"+type).add({nama: val});
        document.getElementById(type === 'kegiatan' ? 'newKegiatan' : 'newBahan').value = "";
        loadMasterData();
    }

    async function deleteMaster(type, id) {
        if(confirm("Hapus?")) { await db.collection("master_"+type).doc(id).delete(); loadMasterData(); }
    }

    function updateDropdowns() {
        let h = `<option value="">-- Pilih Kegiatan --</option>`;
        masterKegiatan.forEach(k => h += `<option value="${k.nama}">${k.nama}</option>`);
        document.getElementById('kegiatanSelect').innerHTML = h;
    }

    // --- FORM LOGIC ---
    function addRowPaddock(vN="", vL="") {
        const d = document.createElement('div'); d.className = 'row-flex'; d.style.marginTop="5px";
        d.innerHTML = `<input type="text" class="p-name" value="${vN}" placeholder="Paddock"><input type="number" class="p-luas" value="${vL}" placeholder="Ha" step="0.01" style="width:100px;" oninput="hitungSemuaBahan()"><button onclick="this.parentElement.remove();hitungSemuaBahan();" style="color:red; border:none; background:none;">✕</button>`;
        document.getElementById('paddockContainer').appendChild(d);
    }

    function addRowUnit(n="", k=0, s=0, r=0) {
        const d = document.createElement('div'); d.className = 'row-flex'; d.style.marginTop="5px";
        d.innerHTML = `<input type="text" class="u-nama" value="${n}" placeholder="Unit" style="flex:2">
            <input type="number" class="u-kerja" value="${k}" placeholder="K" title="Kerja">
            <input type="number" class="u-stby" value="${s}" placeholder="S" title="Standby">
            <input type="number" class="u-rusak" value="${r}" placeholder="R" title="Rusak">
            <button onclick="this.parentElement.remove()" style="color:red; border:none; background:none;">✕</button>`;
        document.getElementById('unitContainer').appendChild(d);
    }

    function addRowBahan(n="", d="", s="Kg") {
        const div = document.createElement('div'); div.className = 'card'; div.style = "background:#f1f5f9; padding:10px; margin-top:5px; position:relative;";
        let opts = masterBahan.map(b => `<option value="${b.nama}" ${b.nama===n?'selected':''}>${b.nama}</option>`).join("");
        div.innerHTML = `<button onclick="this.parentElement.remove();hitungSemuaBahan();" style="position:absolute;right:5px;top:5px;border:none;background:red;color:white;border-radius:50%;width:18px;height:18px;font-size:10px;">✕</button>
            <select class="b-nama"><option value="">-- Pilih Bahan --</option>${opts}</select>
            <div class="row-flex"><input type="number" class="b-dosis" value="${d}" placeholder="Dosis/Ha" oninput="hitungSemuaBahan()"><select class="b-satuan" style="width:80px;"><option value="Kg" ${s==='Kg'?'selected':''}>Kg</option><option value="L" ${s==='L'?'selected':''}>L</option></select></div>
            <input type="number" class="b-total" readonly style="background:#ddd; margin-top:5px;" placeholder="Total">`;
        document.getElementById('bahanContainer').appendChild(div);
        hitungSemuaBahan();
    }

    function hitungSemuaBahan() {
        const totalL = Array.from(document.querySelectorAll('.p-luas')).reduce((a, b) => a + (parseFloat(b.value) || 0), 0);
        document.querySelectorAll('#bahanContainer .card').forEach(row => {
            const dos = parseFloat(row.querySelector('.b-dosis').value) || 0;
            row.querySelector('.b-total').value = (totalL * dos).toFixed(2);
        });
    }

    async function simpanData() {
        const type = document.querySelector('.tab-menu button.active').innerText.includes('PLAN') ? 'Planning' : 'Hasil';
        const payload = {
            tgl: document.getElementById('tglLaporan').value,
            type: type,
            kegiatan: document.getElementById('kegiatanSelect').value,
            hk: parseInt(document.getElementById('hk').value) || 0,
            catatan: document.getElementById('catatan').value,
            paddocks: Array.from(document.querySelectorAll('.p-name')).map((el, i) => ({
                name: el.value, luas: parseFloat(document.querySelectorAll('.p-luas')[i].value) || 0
            })).filter(p => p.name !== ""),
            units: Array.from(document.querySelectorAll('#unitContainer .row-flex')).map(row => ({
                nama: row.querySelector('.u-nama').value,
                kerja: parseInt(row.querySelector('.u-kerja').value) || 0,
                stby: parseInt(row.querySelector('.u-stby').value) || 0,
                rusak: parseInt(row.querySelector('.u-rusak').value) || 0
            })).filter(u => u.nama !== ""),
            materials: Array.from(document.querySelectorAll('#bahanContainer .card')).map(row => ({
                nama: row.querySelector('.b-nama').value,
                dosis: parseFloat(row.querySelector('.b-dosis').value) || 0,
                satuan: row.querySelector('.b-satuan').value,
                total: parseFloat(row.querySelector('.b-total').value) || 0
            })).filter(m => m.nama !== "")
        };

        if(!payload.kegiatan) return alert("Pilih Kegiatan!");
        await db.collection("reports_v15").add(payload);
        alert("Data Berhasil Disimpan!");
        clearForm();
        refreshView();
    }

    function clearForm() {
        document.getElementById('kegiatanSelect').value = "";
        document.getElementById('hk').value = "";
        document.getElementById('catatan').value = "";
        document.getElementById('paddockContainer').innerHTML = ""; addRowPaddock();
        document.getElementById('unitContainer').innerHTML = "";
        document.getElementById('bahanContainer').innerHTML = "";
    }

    function refreshView() {
        const tgl = document.getElementById('tglLaporan').value;
        const type = document.querySelector('.tab-menu button.active').innerText.includes('PLAN') ? 'Planning' : 'Hasil';
        db.collection("reports_v15").where("tgl", "==", tgl).where("type", "==", type).onSnapshot(snap => {
            let h = "";
            snap.forEach(doc => {
                const d = doc.data();
                h += `<div class="card" style="border-left:5px solid var(--primary)">
                    <div style="display:flex; justify-content:space-between"><b>${d.kegiatan}</b> <button onclick="hapusData('${doc.id}')" style="color:red;border:none;background:none;">✕</button></div>
                    <small>${d.paddocks.map(p => p.name).join(", ")}</small><br>
                    <small>Bahan: ${d.materials.map(m => m.nama + ":" + m.total).join(", ")}</small>
                </div>`;
            });
            document.getElementById('displayList').innerHTML = h;
        });
    }

    function hapusData(id) { if(confirm("Hapus?")) db.collection("reports_v15").doc(id).delete(); }

    // Init
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('tglLaporan').value = today;
    document.getElementById('tglDash').value = today;
    loadMasterData();
    switchTab('Dash');
</script>
</body>
</html>
